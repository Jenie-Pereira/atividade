 <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <link rel="stylesheet" href="../css/estrutura.css">
        <link rel="stylesheet" href="../css/flexbox.class">
        <link rel="stylesheet" href="../css/templates_telas.css">
        <meta charset="UTF-8">
        <title>Clube de leitura</title>
    </head>
    
    <body id="formulario">
        <div class="container">
        <form class="form" action="/enviar" method="post">
            <fieldset>
                <legend>Faça seu cadastro aqui:</legend>
            
            <label for="nome">Nome:</label>
            <input 
                type="text" 
                id="nome" 
                name="nome" 
                pattern="[A-Za-zÀ-ÿ\s]+" 
                title="Digite apenas letras e espaços" 
                placeholder="Digite seu nome" 
                required
            >

            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                pattern="^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$"
                title="Digite um email válido"
                placeholder="@gmail.com @yahoo, @outlook..." 
                required
            >

            <label for="CEP">CEP:</label>
            <input 
                type="text" 
                id="CEP" 
                name="CEP" 
                pattern="[0-9]{5}-?[0-9]{3}" 
                title="Digite um CEP válido com 8 números. Exemplo: 12345-678 ou 12345678" 
                placeholder="0000-000"
            >

            <button type="submit">Enviar</button>
            </fieldset>
        </form>
        </div>

    </body>
</html>
